<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- 25% HORIZONTALLY STRETCHED GLOBAL EYE PICTOGRAM ICON -->
  <g transform="translate(10, 10) scale(0.22)" stroke="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Globe Outer Ellipse (25% Horizontally Stretched: rx=175, ry=140) -->
    <ellipse cx="225" cy="180" rx="175" ry="140" stroke="url(#logo-blue)" stroke-width="8" fill="none" />

    <!-- Equator Line -->
    <line x1="50" y1="180" x2="400" y2="180" stroke="url(#logo-blue)" stroke-width="5" opacity="0.8" />

    <!-- Latitude Ellipse Arcs -->
    <path d="M 75,110 Q 225,145 375,110" stroke="url(#logo-blue)" stroke-width="5" fill="none" opacity="0.85" />
    <path d="M 75,250 Q 225,215 375,250" stroke="url(#logo-blue)" stroke-width="5" fill="none" opacity="0.85" />

    <!-- Prime Meridian & Longitude Arcs -->
    <line x1="225" y1="40" x2="225" y2="320" stroke="url(#logo-blue)" stroke-width="5" opacity="0.8" />
    <path d="M 225,40 C 145,100 145,260 225,320" stroke="url(#logo-blue)" stroke-width="5" fill="none" opacity="0.85" />
    <path d="M 225,40 C 305,100 305,260 225,320" stroke="url(#logo-blue)" stroke-width="5" fill="none" opacity="0.85" />

    <!-- CENTER EYE PICTOGRAM HARMONIZED -->
    <path d="M 120,180 Q 225,105 330,180 Q 225,255 120,180 Z" fill="#0a0f1d" stroke="none" />
    <path d="M 120,180 Q 225,105 330,180 Q 225,255 120,180 Z" stroke="url(#logo-gold)" stroke-width="9" fill="none" />

    <!-- Iris Circle -->
    <circle cx="225" cy="180" r="38" stroke="url(#logo-gold)" stroke-width="7" fill="#0a0f1d" />

    <!-- Pupil Solid Circle -->
    <circle cx="225" cy="180" r="18" fill="url(#logo-gold)" stroke="none" />

    <!-- Light Reflection Highlight Dot -->
    <circle cx="232" cy="174" r="5" fill="#ffffff" stroke="none" />
  </g>

  <!-- BRAND TYPOGRAPHY: FALUKÉP 360 -->
  <g transform="translate(125, 52)">
    <text font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="32" fill="#ffffff" letter-spacing="1">FALUKÉP</text>
    <text x="152" y="0" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="32" fill="url(#logo-gold)" letter-spacing="1">360</text>
    <text x="2" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="3.5">VIZUÁLIS ÖRÖKSÉGVÉDELEM</text>
  </g>
</svg>
